[project]
name = "dmqclib"
version = "999.0.0"
description = "DEPRECATED — this package has been renamed to aiqclib."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
authors = [
    { name = "Takaya Saito", email = "takaya.saito@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiqclib",
]

[project.urls]
Homepage = "https://github.com/AIQC-Hub/aiqclib"
"New Package" = "https://pypi.org/project/aiqclib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmqclib"]
